# F1 ML project configuration.
# Paths are relative to the project root.

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  models: data/models

features:
  min_year: 2010
  storage_format: parquet  # parquet | pickle | csv

training:
  test_years: 2

xgboost:
  classifier:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
  regressor:
    n_estimators: 600
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
